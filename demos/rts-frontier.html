<html lang="en" data-wildlands-app="rts">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f6f5ee"><meta name="description" content="An offline isometric real-time strategy match built with Wildlands.">
<meta name="wildlands-engine" content="5fb4ca14cb669593fa6acc8eae107fc86d388d8b22cc297e0894fcad20c87bed"><meta name="wildlands-game-digest" content="63b0bfff27fcfad220b44f341f0752427dd2f0ef0be0cc72c268a613e113a67e">
<title>Wildlands RTS</title>
<style>
#rts-demo {background:var(--paper);color:var(--ink);padding:20px;max-width:1800px;margin:auto}
.rts-header {display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.rts-header h1 {font-size:26px;font-weight:550;letter-spacing:-.03em;margin:4px 0}
.rts-time {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#rts-demo button,#rts-demo select,#rts-demo input {min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:7px;background:var(--card);padding:8px 12px;color:var(--ink);font-size:13px}
#rts-demo button:hover:not(:disabled) {background:var(--green-light);border-color:var(--green)}
#rts-demo button:focus-visible,#rts-demo select:focus-visible,#rts-demo input:focus-visible,.rts-world:focus-visible,.rts-minimap:focus-visible {outline:3px solid var(--amber);outline-offset:2px}
.rts-resources {display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:13px 16px;background:var(--green-dark);color:var(--card);border-radius:9px 9px 0 0}
.rts-resources span {display:flex;align-items:center;gap:7px}
.rts-resources b {font-variant-numeric:tabular-nums;font-size:16px}
.rts-resources i {width:8px;height:8px;border-radius:50%;border:1px solid #fff8}
.rts-layout {display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:0;border:1px solid var(--line);background:var(--card)}
.rts-field {position:relative;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.rts-map-label {height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.rts-world {display:block;width:100%;height:min(65vh,700px);min-height:390px;touch-action:none;cursor:crosshair}
.rts-map-tools {position:absolute;left:14px;bottom:57px;display:flex;gap:5px}
.rts-status {min-height:42px;margin:0;padding:12px 14px;background:var(--green-light);border-top:1px solid var(--line)}
.rts-status.is-error {color:var(--ink);background:var(--card);border-left:1px solid var(--rose)}
.rts-drag {position:absolute;pointer-events:none;border:1px solid var(--green);background:#426a5424}
.rts-inspector {padding:16px;border-left:1px solid var(--line);overflow:auto;max-height:calc(65vh + 72px)}
.rts-minimap {width:100%;height:150px;border:1px solid var(--line);border-radius:7px;margin-bottom:20px;image-rendering:pixelated;cursor:pointer}
.rts-selection h2 {font-size:20px;line-height:1.25;margin:7px 0 14px;letter-spacing:-.02em}
.rts-selection p,.rts-inspector details p {line-height:1.6;color:var(--muted)}
.rts-small {font-size:12px;overflow-wrap:anywhere}
.rts-unit-row {display:flex;justify-content:space-between;gap:8px;margin:9px 0}
.rts-unit-row small {color:var(--muted);white-space:nowrap}
.rts-actions h3 {font-size:13px;margin:20px 0 8px}
.rts-action-grid {display:grid;gap:6px}
.rts-action-grid button {text-align:left;line-height:1.4}
.rts-inspector details {border-top:1px solid var(--line);padding:14px 0;margin-top:10px}
.rts-inspector summary {cursor:pointer;font-weight:600}
.rts-objectives ul {padding-left:18px;line-height:1.5}
.rts-objectives li {margin:10px 0}
.rts-objectives small {display:block;color:var(--muted)}
.rts-footer {border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;padding:12px 14px;background:var(--card)}
.rts-orders {display:flex;flex-wrap:wrap;gap:7px}
.rts-log {margin-top:12px;color:var(--muted);font-size:12px;min-height:18px;line-height:1.5}
@media(max-width:1050px) {.rts-layout {grid-template-columns:minmax(0,1fr) 245px}.rts-header {align-items:flex-start}.rts-world {height:60vh}}
@media(max-width:760px) {#rts-demo {padding:10px;display:flex;flex-direction:column}.rts-header {display:block}.rts-time {margin-top:12px}.rts-resources {gap:12px;font-size:12px}.rts-layout {display:block}.rts-world {height:390px;min-height:320px}.rts-header {order:0}.rts-resources {order:1}.rts-footer {order:2;position:sticky;top:0;z-index:3;border-top:1px solid var(--line);border-radius:0;padding:8px}.rts-layout {order:3}.rts-log {display:none}.rts-inspector {max-height:none;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px}.rts-minimap {height:140px}.rts-actions,.rts-inspector details {grid-column:1/-1}.rts-action-grid {grid-template-columns:1fr 1fr}.rts-orders {display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.rts-orders button {white-space:normal;line-height:1.4;padding:8px}.rts-header h1 {font-size:24px}}
@media(prefers-reduced-motion:reduce) {#rts-demo button {transition:none}}

.rts-roster {display:grid;gap:6px;margin-top:12px;max-height:260px;overflow:auto}
.rts-roster button {text-align:left}
.rts-queue-row {display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.rts-queue-row small {display:block;color:var(--muted);margin-top:3px}

.rts-command-form {border-top:1px solid var(--line);margin-top:20px;padding-top:14px;display:grid;gap:10px;grid-column:1/-1}
.rts-command-form h3 {font-size:13px;margin:0}
.rts-command-form label {display:grid;gap:5px;font-size:12px;min-width:0}
.rts-command-form select,.rts-command-form input {width:100%;box-sizing:border-box;min-width:0}
.rts-coordinates {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rts-command-form p {margin:0;line-height:1.5;color:var(--muted)}

.rts-disabled-reason {display:block;margin-top:5px;font-size:12px;line-height:1.4;font-weight:400;color:var(--ink)}

</style>
<style>
/* The RTS demo shares the existing paper, green ink and accessible workspace controls. */
#rts-mode{position:fixed;inset:0;z-index:100;background:var(--experience-paper,#faf8ef);color:var(--experience-ink,#294b3b);display:flex;flex-direction:column;overflow:auto}
#rts-mode[hidden]{display:none}
body.rts-active #app,body.rts-active #wildlands-workspace{visibility:hidden;pointer-events:none}
.rts-exchange{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;border-bottom:1px solid #b5c2a4;font-size:13px}
.rts-exchange[hidden]{display:none}
.rts-exchange label{display:flex;align-items:center;gap:6px}
.rts-exchange button,.rts-exchange select{font:inherit;min-height:44px;padding:7px 10px;border:1px solid #8b9e7d;border-radius:6px;color:inherit;background:#fffdf6}
.rts-exchange button{cursor:pointer}.rts-exchange button:hover{background:#e6ecd9}
.rts-exchange :focus-visible{outline:2px solid #38624b;outline-offset:3px}
.rts-exchange select{max-width:220px}.rts-exchange [role=alert]{color:#843d28}
.rts-play-surface{flex:1;min-height:0;position:relative}
@media(max-width:700px){.rts-exchange{gap:6px;padding:6px;font-size:12px}.rts-exchange select{max-width:160px}.rts-play-surface{min-height:600px}}

</style>
<style>
/* Standalone game templates (RTS, Pet) do not load the colony stylesheet. These tokens mirror
   style.css :root exactly (an architecture check compares them) so game surfaces keep one palette. */
:root{
  --paper: #f6f5ee;
  --card: #fffef8;
  --ink: #31463d;
  --muted: #7f8a79;
  --line: #e2e5d8;
  --green: #426a54;
  --green-dark: #315441;
  --green-light: #e8eee0;
  --amber: #b78f4e;
  --rose: #b77770;
  --shadow: 0 8px 26px #3045320c;
  font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-synthesis: none;
  color: var(--ink);
  background: var(--paper);
  font-size: 13px
}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b69150;outline-offset:3px}
#play-shell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;padding:24px;text-align:center}
#play-status{margin:0;font-size:15px;max-width:60ch}
#play-status[role=alert]{color:#843d28}
#play-resume{min-height:44px;padding:8px 16px;border:1px solid #8b9e7d;border-radius:6px;background:var(--card)}
#play-resume[hidden]{display:none}

</style>
