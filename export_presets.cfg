[preset.0]
name="Linux Desktop"
platform="Linux"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="data/**/*.json,build-identity.json"
exclude_filter="tests/*,docs/*,reports/*,builds/*,scripts/*.py,*.md"
export_path=""
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.export-templates/linux_debug.x86_64"
custom_template/release="res://.export-templates/linux_release.x86_64"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

