# Source snapshots support verified Littlewild milestone development and review.
name: Source project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=motorsport-manager/ HEAD -o /tmp/motorsport-manager-source.zip
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motorsport-manager-source
          path: /tmp/motorsport-manager-source.zip
          if-no-files-found: error
          retention-days: 14
