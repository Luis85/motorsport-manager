name: Scene Forge verification
on:
  pull_request:
    paths:
      - 'source/scene-forge/**'
      - 'source/model-forge/src/kernel/**'
      - 'source/model-forge/package.json'
      - 'source/model-forge/package-lock.json'
      - 'bin/scene-forge'
      - 'docs/reference/scene-forge-cli.md'
      - '.github/workflows/scene-forge.yml'
      # The Littlewild tests read the concept corpus (lossless round trips) and the
      # definitions the example manifests publish (sync --check).
      - 'docs/concepts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scene-forge-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/scene-forge/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: source/scene-forge
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        working-directory: source/scene-forge
        run: npm run format:check
      - name: Verify architecture boundaries
        working-directory: source/scene-forge
        run: npm run architecture:check
      - name: Type-check
        working-directory: source/scene-forge
        run: npm run check
      - name: Run unit and integration tests
        working-directory: source/scene-forge
        run: npm test
      - name: Verify checked-in bin/scene-forge matches source
        working-directory: source/scene-forge
        run: npm run check:cli
      - name: Smoke-test bin/scene-forge from the repository root
        shell: bash
        run: |
          set -euo pipefail
          bin/scene-forge --version
          bin/scene-forge --compact example list > /dev/null
