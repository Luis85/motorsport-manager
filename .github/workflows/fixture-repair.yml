name: Verify numerical fixture field repair
on:
  push:
    branches: [chore/json-number-fixture-e280e945-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_COMMIT: 990771b80138d19dce580e0b93e784b7654adbb4
      EXPECTED_TREE: e280e9450eb52470e4637f1fcfd64176531b69b4
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the field-only repair to the exact PR source
        shell: bash
        run: |
          set -euo pipefail
          cp fixture-repair.patch /tmp/fixture-repair.patch
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/fixture-repair.patch
          git apply --index /tmp/fixture-repair.patch
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = Path('tests/fixtures/json_number_cases.json')
          raw = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == '36fd6878b42d3e4e9d4ac31d62474fa87d49897f', 'Unexpected source fixture'
          before = json.loads(raw)
          assert len(before) == 544 and all(set(row) == {'token', 'bits'} for row in before)
          updated = raw.replace(b'"token":', b'"decimal_literal":')
          after = json.loads(updated)
          assert [(r['token'], r['bits']) for r in before] == [(r['decimal_literal'], r['bits']) for r in after]
          p.write_bytes(updated)
          PY
          git add tests/fixtures/json_number_cases.json
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github)"
          python3 -m unittest discover -s tests -p test_json_number_fixtures.py -v
          python3 scripts/check_architecture.py
      - name: Verify production numerical persistence coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          python3 scripts/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --suite content_persistence_tests
      - name: Publish the verified tree without changing scanner settings or history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'test: clarify numerical fixture fields flagged by secret scanning' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/json-number-fixture-e280e945-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-fixture-repair-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 14
