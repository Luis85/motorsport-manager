name: Standalone application
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify matching desktop templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum --check
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          output = Path('toolchain')
          names = ['linux_debug.x86_64', 'linux_release.x86_64', 'windows_debug_x86_64.exe', 'windows_release_x86_64.exe']
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'templates.tpz') as archive:
              version = archive.read('templates/version.txt').decode().strip()
              assert version == '4.7.2.stable', version
              digests = {}
              for name in names:
                  data = archive.read('templates/' + name)
                  assert data, name
                  (output / name).write_bytes(data)
                  digests[name] = hashlib.sha256(data).hexdigest()
          (output / 'manifest.json').write_text(json.dumps({'version': version, 'archive_sha256': 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011', 'files': digests}, indent=2) + '\n')
          PY
          printf '%s\n' "$url" > toolchain/origin.txt
          curl --fail --location --retry 3 https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt -o toolchain/LICENSE.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinned-desktop-export-templates
          path: toolchain/
          if-no-files-found: error
          retention-days: 7
  build:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pinned-desktop-export-templates
          path: ${{ runner.temp }}/templates
      - name: Install pinned export editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64" | sha256sum --check
          chmod +x "$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
      - name: Export from a clean import
        env:
          LP_NUM_THREADS: '2'
        run: >-
          python scripts/build_standalone.py
          --godot "${{ runner.temp }}/engine/Godot_v4.7.2-stable_linux.x86_64"
          --templates "${{ runner.temp }}/templates"
          --target ${{ matrix.target }} --mode ${{ matrix.mode }}
          --revision "${{ github.sha }}"
          --output "builds/${{ matrix.target }}-${{ matrix.mode }}"
      # The artifact service normalizes raw files to 0644. Transport a tar archive
      # so users and the smoke job receive the exported executable's actual mode.
      - name: Preserve executable permissions in the distributed archive
        shell: bash
        run: >-
          tar -czf "${{ runner.temp }}/standalone-${{ matrix.target }}-${{ matrix.mode }}.tar.gz"
          -C "builds/${{ matrix.target }}-${{ matrix.mode }}" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.target }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/standalone-${{ matrix.target }}-${{ matrix.mode }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: standalone-build-failure-${{ matrix.target }}-${{ matrix.mode }}
          path: builds/${{ matrix.target }}-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
  native-smoke:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            mode: debug
            runner: ubuntu-24.04
          - target: linux
            mode: release
            runner: ubuntu-24.04
          - target: windows
            mode: debug
            runner: windows-2022
          - target: windows
            mode: release
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-${{ matrix.target }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/transport
      - name: Extract the same permission-preserving archive distributed to players
        shell: bash
        working-directory: ${{ runner.temp }}
        # The runner sets native cwd. GNU tar receives relative paths only, not
        # Windows drive prefixes or mixed backslash/forward-slash destinations.
        run: |
          mkdir -p package
          tar -xzf "transport/standalone-${{ matrix.target }}-${{ matrix.mode }}.tar.gz" -C package
      - name: Execute relocated build and restart/recovery journeys on target OS
        run: >-
          python scripts/smoke_standalone.py
          --package "${{ runner.temp }}/package"
          --output "reports/standalone-${{ matrix.target }}-${{ matrix.mode }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: standalone-evidence-${{ matrix.target }}-${{ matrix.mode }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
