name: Publish RTS editor standalone
on:
  push:
    branches: [feature/rts-mission-editor]
    paths: [.github/workflows/rts-editor-standalone-publication.yml]
permissions:
  contents: read
jobs:
  standalone:
    if: github.repository == 'Luis85/motorsport-manager' && github.ref == 'refs/heads/feature/rts-mission-editor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/rts-mission-editor
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: docs/concepts/littlewild
      - run: npm run typecheck && npm run build
        working-directory: docs/concepts/littlewild
      - name: Commit generated standalone only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/concepts/littlewild/littlewild.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: regenerate mission editor standalone'
          git push origin HEAD:feature/rts-mission-editor
