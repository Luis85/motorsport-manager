name: Validate recovered iteration four
on:
  push:
    branches: [iteration-4-validation]
    paths: ['.maintenance/**', '.github/workflows/iteration4-recovery.yml']
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact verified source
        run: python3 .maintenance/apply_iteration.py
      - name: Install pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          sudo ln -s /tmp/godot/Godot_* /usr/local/bin/godot
      - name: Verify native project before commit
        run: python3 scripts/verify.py
      - name: Commit validated source to recovery branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs scripts tests
          git commit -m 'feat: complete validated iteration-four source and documentation'
          git push origin HEAD:refs/heads/iteration-4-validation
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration-four-recovery-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
