name: Character Studio verification
on:
  pull_request:
    paths:
      - 'source/character-studio/**'
      - 'source/wildlands/source/**'
      - 'docs/concepts/littlewild/**'
      - 'source/model-forge/src/kernel/**'
      - 'bin/character-studio'
      - 'bin/scene-forge'
      - 'bin/model-forge'
      - '.github/workflows/character-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/character-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/character-studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:cli
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:handoff
      - name: Build authoritative engine integration dependencies
        working-directory: source/wildlands
        run: npm ci --no-audit --no-fund && npm run build
      - name: Validate engine and game-folder handoffs
        run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Smoke standalone discovery without local dependencies
        working-directory: /tmp
        run: node "$GITHUB_WORKSPACE/bin/character-studio" discover
