name: Content and exported runtime
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: content-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      LP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Capture the exact tested source for offline reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/content-verification-source
          git rev-parse HEAD > /tmp/content-verification-source/commit.txt
          git rev-parse 'HEAD^{tree}' > /tmp/content-verification-source/tree.txt
          git archive --format=tar.gz --output=/tmp/content-verification-source/source.tar.gz HEAD
          (cd /tmp/content-verification-source && sha256sum source.tar.gz > source.sha256)
      - name: Retain source snapshot independently of test success
        uses: actions/upload-artifact@v4
        with:
          name: content-verification-source
          path: /tmp/content-verification-source/
          if-no-files-found: error
          retention-days: 2
      - name: Install the repository-pinned engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          sudo ln -s /tmp/godot/Godot_* /usr/local/bin/godot
          godot --version | tee /tmp/godot-version.txt
          sha256sum /tmp/godot.zip > /tmp/godot-sha256.txt
      - name: Install matching Linux export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/linux-export-templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j /tmp/templates.tpz templates/linux_debug.x86_64 templates/linux_release.x86_64 templates/version.txt -d /tmp/linux-export-templates
          sha256sum /tmp/templates.tpz > /tmp/linux-export-templates/archive-sha256.txt
          cp /tmp/linux-export-templates/linux_* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Check generated authoring schemas
        run: python3 scripts/content.py schemas --check --godot /usr/local/bin/godot
      - name: Verify content and serialized boundaries
        run: python3 scripts/verify.py --godot /usr/local/bin/godot --suite mechanics_tests --suite car_record_tests --suite content_tests --suite content_pack_tests --suite content_tyre_tests --suite content_tuning_tests --suite content_environment_tests --suite content_operations_tests --suite content_competition_tests --suite content_persistence_tests --suite content_catalog_tests
      - name: Execute debug and release exports with file-only expansions
        run: python3 scripts/verify_content_export.py --godot /usr/local/bin/godot --output reports/content-export
      - name: Retain exact toolchain for offline reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-verification-toolchain-linux
          path: |
            /tmp/godot.zip
            /tmp/godot-version.txt
            /tmp/godot-sha256.txt
          if-no-files-found: error
          retention-days: 1
      - name: Retain Linux export toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-export-templates-linux
          path: /tmp/linux-export-templates/
          if-no-files-found: error
          retention-days: 1
      - name: Retain source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-verification
          path: reports/
          if-no-files-found: error
          retention-days: 14
