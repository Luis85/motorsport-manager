name: Littlewild ECS rebuild
on:
  push:
    branches: [concept/littlewild-v15-world-ui]
    paths:
      - 'docs/concepts/littlewild/source/**'
      - 'docs/concepts/littlewild/verify-v15.py'
      - 'docs/concepts/littlewild/*.md'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
permissions:
  contents: write
jobs:
  verify-and-rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: concept/littlewild-v15-world-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        working-directory: docs/concepts/littlewild
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python - <<'PY'
from playwright.sync_api import sync_playwright
with sync_playwright() as p:
    print(p.chromium.executable_path)
PY
          )"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
      - name: Verify source and rebuild standalone artifact
        working-directory: docs/concepts/littlewild
        run: python verify-v15.py
      - name: Commit generated artifact and verification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/concepts/littlewild/littlewild.html
          git add docs/concepts/littlewild/source/*results.json
          git add docs/concepts/littlewild/verification/v15
          if git diff --cached --quiet; then
            echo 'Generated outputs already current.'
          else
            git commit -m 'build(littlewild): refresh ECS artifact and verification evidence'
            git push
          fi
