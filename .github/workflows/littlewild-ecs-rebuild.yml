name: Littlewild ECS verification
on:
  pull_request:
    paths:
      - 'source/wildlands/**'
      - 'bin/wildlands'
      - 'docs/reference/wildlands-cli.md'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: littlewild-ecs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # The expanded registered gate retains its per-suite limits and needs a full job budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/wildlands/package-lock.json
      - name: Install TypeScript verification toolchain
        working-directory: source/wildlands
        run: npm ci --no-audit --no-fund
      - name: Type-check strict architecture kernel
        working-directory: source/wildlands
        run: npm run typecheck
      - name: Verify architecture boundaries
        working-directory: source/wildlands
        run: npm run architecture
      - name: Verify checked-in bin/wildlands matches source
        working-directory: source/wildlands
        # Performs a full build into .generated/ and littlewild.html; the next step clears that output.
        run: npm run check:cli
      - name: Clear stale Littlewild verification evidence
        working-directory: source/wildlands
        run: |
          rm -rf verification/v15 .generated
          rm -f littlewild.html
      - name: Install Chromium
        working-directory: source/wildlands
        run: npx playwright install --with-deps chromium
      - name: Rebuild and verify all Littlewild contracts
        id: complete_gate
        working-directory: source/wildlands
        env:
          LITTLEWILD_STORY_CLICK_DIAGNOSTICS: '1'
        run: npm run verify
      - name: Verify Storytelling without click diagnostics (additional 24 checks)
        id: storytelling_diagnostics_off
        if: ${{ success() && steps.complete_gate.outcome == 'success' }}
        working-directory: source/wildlands
        env:
          LITTLEWILD_STORYTELLING_OUT: ${{ github.workspace }}/source/wildlands/verification/storytelling-diagnostics-off
          # Reviewed expectations; acceptance still requires the actual complete gate.
          LITTLEWILD_EXPECTED_GATE_CHECKS: '1740'
          LITTLEWILD_REVIEWED_NEW_CHECKS_JSON: |-
            [
              {"suite":"creatures","name":"Forced world paints reuse rigs and invalidate each authored visual identity exactly once"},
              {"suite":"animations","name":"Owned p5 focus hooks release by identity across concurrent, reentrant, rejected and failed construction lifecycles"},
              {"suite":"renderer-storytelling","name":"Actual p5 repeated owned layers release focus-hook identities and preserve concurrent focus and external hooks"},
              {"suite":"renderer-storytelling","name":"Actual p5 cancellation and rejected foreign cleanup release only the owned focus hook"},
              {"suite":"storytelling-browser","name":"Synthetic queued preview readiness publishes admitted transport before another application frame"},
              {"suite":"wildlands-runtime","name":"Discovery describes every transported operation and SDK allowlist without ticking"},
              {"suite":"wildlands-runtime","name":"Detached native view includes canonical physical world, assets and scenario profile"},
              {"suite":"wildlands-runtime","name":"Bridge commands and exact fixed steps produce the same authoritative SDK continuation"},
              {"suite":"wildlands-runtime","name":"Invalid clock and command input preserve the full RNG and production story"},
              {"suite":"wildlands-runtime","name":"Pause, inspection and authoring queries never advance simulation time"},
              {"suite":"wildlands-runtime","name":"Failed scenario/story replacements preserve an existing complete continuation"},
              {"suite":"wildlands-runtime","name":"Portable story restore retains exact state and permits deterministic continuation"},
              {"suite":"wildlands-runtime","name":"Scenario switching uses canonical built-in ownership and rejects stale reflection"},
              {"suite":"wildlands-runtime","name":"Reviewed scene transitions retain canonical visited checkpoint ownership"},
              {"suite":"wildlands-runtime","name":"Retained scene drafts edit, undo and export without mutating a running world"},
              {"suite":"wildlands-runtime","name":"Asynchronous SDK validation is awaited and returns its detached result"},
              {"suite":"wildlands-runtime","name":"Complete source export can roundtrip through the same bounded protocol validator"},
              {"suite":"wildlands-runtime","name":"Graph-less prototype captures and cinematic sampling preserve all authored scenes"},
              {"suite":"wildlands-runtime","name":"Malformed and duplicate-key envelopes fail without accessors or mutation"},
              {"suite":"wildlands-runtime","name":"Project startup applies the same strict admission as web and CLI"},
              {"suite":"wildlands-runtime","name":"JSON-lines process correlates UTF8 requests, recovers malformed lines and closes cleanly"},
              {"suite":"wildlands-runtime","name":"Oversized line is drained with bounded memory and next request still succeeds"},
              {"suite":"wildlands-runtime","name":"Pack/project startup files preserve authored scene and reject duplicate JSON keys"},
              {"suite":"wildlands-runtime","name":"Shutdown and EOF release owned session so a fresh SDK session can open"},
              {"suite":"wildlands-project","name":"Default project is a complete detached Littlewild prototype"},
              {"suite":"wildlands-project","name":"Versioned discovery describes useful portable and bounded agent operations"},
              {"suite":"wildlands-project","name":"Project fields, target, identity and scene selection are validated strictly"},
              {"suite":"wildlands-project","name":"Authoritative scenario validation rejects semantic world corruption"},
              {"suite":"wildlands-project","name":"Scenario switching preserves project identity and supports portable custom packs"},
              {"suite":"wildlands-project","name":"Deterministic bounded recipes capture changed state without losing authored scenes"},
              {"suite":"wildlands-project","name":"Paused steps report requested clock work independently from actual advancement"},
