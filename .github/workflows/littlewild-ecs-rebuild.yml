name: Littlewild ECS verification
on:
  pull_request:
    paths:
      - 'docs/concepts/littlewild/**'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: littlewild-ecs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/concepts/littlewild/package-lock.json
      - name: Clear stale Littlewild verification evidence
        working-directory: docs/concepts/littlewild
        run: |
          rm -rf verification/v15 .generated
          rm -f littlewild.html
      - name: Install TypeScript verification toolchain
        working-directory: docs/concepts/littlewild
        run: npm ci --no-audit --no-fund
      - name: Type-check strict architecture kernel
        working-directory: docs/concepts/littlewild
        run: npm run typecheck
      - name: Verify architecture boundaries
        working-directory: docs/concepts/littlewild
        run: npm run architecture
      - name: Install Chromium
        working-directory: docs/concepts/littlewild
        run: npx playwright install --with-deps chromium
      - name: Rebuild and verify all Littlewild contracts
        working-directory: docs/concepts/littlewild
        run: npm run verify
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlewild-ecs-verification
          path: |
            docs/concepts/littlewild/package-lock.json
            docs/concepts/littlewild/littlewild.html
            docs/concepts/littlewild/verification/v15/
            docs/concepts/littlewild/.generated/*-results.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
