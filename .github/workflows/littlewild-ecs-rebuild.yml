              {"suite":"skill-trees","name":"Optional progression belongs to the scoped actor without introducing defaults"},
              {"suite":"skill-trees","name":"Player and creature attachments award independently and never retroactively grant level XP"},
              {"suite":"skill-trees","name":"Accepted reward settlement credits its scoped creature and player exactly once"},
              {"suite":"skill-trees","name":"Unlocked rank effects apply to the working actor and survive engine restoration"},
              {"suite":"skill-trees","name":"Guide bonuses apply to companions without spending their personal points"},
