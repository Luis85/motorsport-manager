              {"suite":"definition-source","name":"Changing one item definition updates price, weight, recipe and visual projections"},
              {"suite":"definition-source","name":"A new item folder appends to every authored facet without catalog registration"},
              {"suite":"definition-source","name":"Derived identity schemas preserve compiled bounds and presentation vocabulary"},
