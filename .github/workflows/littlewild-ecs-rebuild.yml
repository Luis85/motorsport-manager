              {"suite":"skill-tree-browser","name":"Tree content fits and retains usable controls at 1440px"},
              {"suite":"skill-tree-browser","name":"Keyboard focus distinguishes trees sharing a node ID at 1440px"},
              {"suite":"skill-tree-browser","name":"Fresh tree displays earned-point gates at 390px"},
              {"suite":"skill-tree-browser","name":"Keyboard unlock publishes a rank and keeps focus at 390px"},
              {"suite":"skill-tree-browser","name":"Branch choice closes the alternative without spending its points at 390px"},
              {"suite":"skill-tree-browser","name":"Tree reads do not tick or change saved state at 390px"},
              {"suite":"skill-tree-browser","name":"Tree content fits and retains usable controls at 390px"},
              {"suite":"skill-tree-browser","name":"Keyboard focus distinguishes trees sharing a node ID at 390px"},
              {"suite":"skill-tree-browser","name":"Skill-tree browser emits no runtime errors or network requests"},
              {"suite":"typescript-architecture","name":"Bundled assets have one authoring source and canonical catalog projections"},
