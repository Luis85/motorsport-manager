name: Littlewild ECS verification
on:
  pull_request:
    paths:
      - 'source/wildlands/**'
      - 'bin/wildlands'
      - 'docs/reference/wildlands-cli.md'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: littlewild-ecs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # The expanded registered gate retains its per-suite limits and needs a full job budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/wildlands/package-lock.json
      - name: Install TypeScript verification toolchain
        working-directory: source/wildlands
        run: npm ci --no-audit --no-fund
      - name: Type-check strict architecture kernel
        working-directory: source/wildlands
        run: npm run typecheck
      - name: Verify architecture boundaries
        working-directory: source/wildlands
        run: npm run architecture
      - name: Verify checked-in bin/wildlands matches source
        working-directory: source/wildlands
        # Performs a full build into .generated/ and littlewild.html; the next step clears that output.
        run: npm run check:cli
      - name: Clear stale Littlewild verification evidence
        working-directory: source/wildlands
        run: |
          rm -rf verification/v15 .generated
          rm -f littlewild.html
      - name: Install Chromium
        working-directory: source/wildlands
        run: npx playwright install --with-deps chromium
      - name: Rebuild and verify all Littlewild contracts
        id: complete_gate
        working-directory: source/wildlands
        env:
          LITTLEWILD_STORY_CLICK_DIAGNOSTICS: '1'
        run: npm run verify
      - name: Verify Storytelling without click diagnostics (additional 24 checks)
        id: storytelling_diagnostics_off
        if: ${{ success() && steps.complete_gate.outcome == 'success' }}
        working-directory: source/wildlands
        env:
          LITTLEWILD_STORYTELLING_OUT: ${{ github.workspace }}/source/wildlands/verification/storytelling-diagnostics-off
          # Reviewed expectations (ordered suites, total checks, named additions, renames and
          # retirements) live in source/verification/gate-expectations.json; acceptance still
          # requires the actual complete gate.
          LITTLEWILD_GATE_EXPECTATIONS: source/verification/gate-expectations.json
        run: |
          env -u LITTLEWILD_STORY_CLICK_DIAGNOSTICS -u NODE_OPTIONS -u LITTLEWILD_CAPTURE_SCREENSHOTS -u PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH -u LITTLEWILD_BROWSER_ARTIFACT node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const {runCommand} = require('./.generated/verification/process-runner.js');
          const {acceptedCounts, sourceIdentity} = require('./.generated/verification/gate-integrity.js');
          const root = process.cwd(), out = process.env.LITTLEWILD_STORYTELLING_OUT;
          if (fs.existsSync(out)) throw Error('Additional evidence directory already exists; refusing to overwrite it.');
          fs.mkdirSync(out, {recursive:true});
          const sha = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const gatePath = path.join(root, 'verification/v15/gate-results.json');
          const baselinePath = path.join(root, 'verification/v15/storytelling-browser-results.json');
          const artifact = path.join(root, 'littlewild.html');
          const suiteSnapshot = gate => {
            const seen = new Set();
            return gate.suites.map(suite => {
              if (typeof suite.result !== 'string' || path.isAbsolute(suite.result) || suite.result.split(/[\\/]/).includes('..'))
                throw Error('Invalid original result path.');
              const target = path.resolve(root, suite.result);
              if (!target.startsWith(root + path.sep) || fs.realpathSync(target) !== target || !fs.lstatSync(target).isFile() || seen.has(target))
                throw Error('Missing, aliased or unbounded original result path: ' + suite.result);
              seen.add(target);
              return {name:suite.name, result:suite.result, bytes:fs.statSync(target).size, sha256:sha(target)};
            });
          };
          const command = ['node', '.generated/verification/storytelling-browser.js'];
          const startedAt = new Date().toISOString();
          let result = null, counts = null, failure = null, unchanged = false;
          let before = null, after = null, gate = null, expectedStoryChecks = null, expectations = null, expectationsIdentity = null;
          try {
            gate = JSON.parse(fs.readFileSync(gatePath, 'utf8'));
            const expectationsPath = path.join(root, process.env.LITTLEWILD_GATE_EXPECTATIONS);
            expectations = JSON.parse(fs.readFileSync(expectationsPath, 'utf8'));
            expectationsIdentity = {path:process.env.LITTLEWILD_GATE_EXPECTATIONS, sha256:sha(expectationsPath)};
            const expectedGateChecks = expectations.totalChecks;
            const reviewedNewChecks = expectations.reviewedAdditions;
            const retiredChecks = expectations.retirements;
            const expectedSuites = expectations.suites;
            // The historical 1543-check baseline is immutable; every later change is a named reviewed entry.
            if (!expectations.historicalBaseline || expectations.historicalBaseline.checks !== 1543 || !Number.isSafeInteger(expectedGateChecks)
                || !Array.isArray(reviewedNewChecks) || !Array.isArray(retiredChecks) || !Array.isArray(expectedSuites) || !expectedSuites.length
                || expectedGateChecks !== 1543 + reviewedNewChecks.length - retiredChecks.length)
              throw Error('Fill the reviewed complete-gate count and named additions before enabling this guard.');
            if (gate.expectationsSha256 !== expectationsIdentity.sha256)
              throw Error('The complete gate did not run against the reviewed gate expectations.');
            const newNames = new Set();
            for (const row of reviewedNewChecks) {
              if (!row || typeof row.suite !== 'string' || !row.suite.trim() || typeof row.name !== 'string' || !row.name.trim()
                  || newNames.has(JSON.stringify([row.suite,row.name]))) throw Error('Invalid reviewed new-check identity.');
              newNames.add(JSON.stringify([row.suite,row.name]));
            }
            expectedStoryChecks = 23 + reviewedNewChecks.filter(row => row.suite === 'storytelling-browser').length;
            if (expectedStoryChecks !== 24) throw Error('Expected the reviewed 24-check Storytelling scope.');
            if (gate.status !== 'passed' || gate.suites.length !== expectedSuites.length
                || JSON.stringify(gate.suites.map(suite => suite.name)) !== JSON.stringify(expectedSuites)
                || gate.total !== expectedGateChecks || gate.passed !== expectedGateChecks)
              throw Error('The complete ' + expectedSuites.length + '-suite gate must pass at the reviewed check count first.');
            let acceptedOriginalTotal = 0;
            for (const suite of gate.suites) {
              if (suite.exitCode !== 0 || suite.error) throw Error('Original registered suite did not pass: ' + suite.name);
              if (typeof suite.result !== 'string' || path.isAbsolute(suite.result) || suite.result.split(/[\\/]/).includes('..'))
                throw Error('Invalid original result path.');
              const target = path.resolve(root,suite.result);
              if (!target.startsWith(root + path.sep) || fs.realpathSync(target) !== target || !fs.lstatSync(target).isFile())
                throw Error('Missing, aliased or unbounded original result path.');
              const report = JSON.parse(fs.readFileSync(target,'utf8'));
              const checked = acceptedCounts(report);
              if (suite.passed !== checked.passed || suite.total !== checked.total) throw Error('Original suite summary differs from accepted leaves.');
              acceptedOriginalTotal += checked.total;
              for (const added of reviewedNewChecks.filter(row => row.suite === suite.name))
                if (!report.results.some(row => row.name === added.name)) throw Error('Reviewed new check is missing: ' + added.name);
            }
            if (acceptedOriginalTotal !== expectedGateChecks || reviewedNewChecks.some(row => !gate.suites.some(suite => suite.name === row.suite)))
              throw Error('Original accepted leaves differ from the reviewed complete-gate scope.');
            const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
            if (acceptedCounts(baseline).total !== expectedStoryChecks) throw Error('Expected all reviewed Storytelling checks: preserved 23 plus named additions.');
            before = {sourceSha256:sourceIdentity(root), htmlSha256:sha(artifact), gateSha256:sha(gatePath), baselineSha256:sha(baselinePath), suiteResults:suiteSnapshot(gate)};
            if (before.sourceSha256 !== gate.sourceSha256 || before.htmlSha256 !== gate.htmlSha256)
              throw Error('Original gate source/artifact identity differs before the additional run.');
            result = runCommand(command, root, 300);
            fs.writeFileSync(path.join(out, 'run.log'), (result.stdout || '') + (result.stderr || ''));
            after = {sourceSha256:sourceIdentity(root), htmlSha256:sha(artifact), gateSha256:sha(gatePath), baselineSha256:sha(baselinePath), suiteResults:suiteSnapshot(gate)};
            unchanged = JSON.stringify(before) === JSON.stringify(after);
            if (!unchanged) throw Error('Source, artifact or original gate evidence changed during the additional run.');
            if (result.error || result.signal || result.status !== 0)
              throw Error('Additional Storytelling process failed: ' + String(result.error || result.signal || result.status));
            const report = JSON.parse(fs.readFileSync(path.join(out, 'storytelling-browser-results.json'), 'utf8'));
            counts = acceptedCounts(report);
            if (counts.total !== expectedStoryChecks || JSON.stringify(report.results.map(row => row.name)) !== JSON.stringify(baseline.results.map(row => row.name)))
              throw Error('Additional run must preserve all 24 reviewed named checks and their order.');
            for (const key of ['errors', 'consoleProblems', 'requests'])
              if (!Array.isArray(report.diagnostics[key]) || report.diagnostics[key].length)
                throw Error('Additional run contains raw diagnostics in ' + key);
            if (fs.existsSync(path.join(out, 'storytelling-click-diagnostics.json')))
              throw Error('Diagnostics-disabled run unexpectedly produced click observations.');
          } catch (error) {
            failure = String(error);
            if (!fs.existsSync(path.join(out, 'run.log'))) fs.writeFileSync(path.join(out, 'run.log'), failure + '\n');
          }
          const versions = {node:process.version, playwright:require('playwright/package.json').version, playwrightCore:require('playwright-core/package.json').version};
          const suiteCount = expectations && Array.isArray(expectations.suites) ? expectations.suites.length : null;
          const receipt = {schema:1, scope:'Additional 24-check observer-independence execution; does not change the complete ' + suiteCount + '-suite gate, its preserved historical 75-suite baseline or reviewed named additions.', status:failure?'failed':'passed', startedAt, finishedAt:new Date().toISOString(), command, timeoutSeconds:300, actionTimeoutMilliseconds:20000, originalGateUnchanged:unchanged, expectedStoryChecks, originalIdentity:before, afterIdentity:after, expectations:expectationsIdentity, expectedGateChecks:expectations ? expectations.totalChecks : null, reviewedNewChecks:expectations && Array.isArray(expectations.reviewedAdditions) ? expectations.reviewedAdditions.length : null, counts, error:failure, process:result?{exitCode:result.status,signal:result.signal,error:result.error?String(result.error):null}:null, versions, browserSelection:'Pinned Playwright requests official full desktop Chromium (channel=chromium); executable override unset. Actual sampled browser version is retained in run.log. Existing launch flags and production CSP are unchanged.', environment:{LITTLEWILD_STORY_CLICK_DIAGNOSTICS:null,NODE_OPTIONS:null,LITTLEWILD_CAPTURE_SCREENSHOTS:null,PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:null,LITTLEWILD_BROWSER_ARTIFACT:null,LITTLEWILD_STORYTELLING_OUT:out,LITTLEWILD_GATE_EXPECTATIONS:process.env.LITTLEWILD_GATE_EXPECTATIONS}};
          fs.writeFileSync(path.join(out, 'additional-storytelling-results.json'), JSON.stringify(receipt,null,2)+'\n');
          process.exitCode = failure ? 1 : 0;
          NODE
      - name: Report additional Storytelling failure details
        if: ${{ failure() && steps.storytelling_diagnostics_off.outcome == 'failure' }}
        working-directory: source/wildlands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from uuid import uuid4

          folder = Path('verification/storytelling-diagnostics-off')
          token = uuid4().hex
          print('::stop-commands::' + token)
          try:
              for name in ('additional-storytelling-results.json', 'storytelling-browser-results.json', 'run.log'):
                  target = folder / name
                  if not target.is_file():
                      print('Additional Storytelling evidence unavailable: ' + name)
                      continue
                  print('\nAdditional Storytelling evidence: ' + name)
                  with target.open('rb') as stream:
                      evidence = stream.read(65537)
                  print(evidence[:65536].decode('utf-8', errors='replace'))
                  if len(evidence) > 65536:
                      print('[Excerpt limited to 65536 bytes; complete evidence is retained in the artifact.]')
          finally:
              print('::' + token + '::')
          PY
      - name: Report failed verification details
        if: failure()
        working-directory: source/wildlands
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from uuid import uuid4

          root = Path.cwd().resolve()
          token = uuid4().hex
          print('::stop-commands::' + token)
          gate_path = root / 'verification/v15/gate-results.json'
          try:
              if gate_path.is_file():
                  gate = json.loads(gate_path.read_text())
                  print(json.dumps(gate, indent=2))
                  for suite in gate.get('suites', []):
                      if suite.get('exitCode') == 0 and not suite.get('error'):
                          continue
                      for relative in (suite.get('result'), 'verification/v15/' + suite['name'] + '.log'):
                          if not relative:
                              continue
                          target = (root / relative).resolve()
                          if not target.is_relative_to(root) or not target.is_file():
                              print('Failed-suite evidence unavailable: ' + relative)
                              continue
                          print('\nFailed-suite evidence: ' + relative)
                          with target.open('rb') as stream:
                              evidence = stream.read(65537)
                          print(evidence[:65536].decode('utf-8', errors='replace'))
                          if len(evidence) > 65536:
                              print('[Log excerpt limited to 65536 bytes; full evidence is retained in the artifact.]')
              else:
                  print('No gate report was produced; inspect the failed preflight step above.')
          finally:
              print('::' + token + '::')
          PY
      - name: Package optional bounded core verification evidence
        if: always()
        continue-on-error: true
        working-directory: source/wildlands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          root = Path.cwd().resolve()
          output = root / 'verification/core-evidence'
          output.mkdir(parents=True, exist_ok=False)
          selected = set()
          missing = []
          def select(path):
              if path.is_symlink() or path.resolve() != path or not path.is_relative_to(root):
                  raise ValueError('Unbounded or aliased core evidence path: ' + str(path))
              if path.is_file():
                  selected.add(path)
              else:
                  missing.append(str(path.relative_to(root)))

          for relative in ('package-lock.json', 'littlewild.html', 'verification/v15/gate-results.json', 'verification/v15/browser-progress.json'):
              select(root / relative)
          gate_path = root / 'verification/v15/gate-results.json'
          gate = json.loads(gate_path.read_text()) if gate_path.is_file() else {}
          for suite in gate.get('suites', []):
              relative = Path(suite['result'])
              if relative.is_absolute() or '..' in relative.parts:
                  raise ValueError('Unbounded registered result path: ' + str(relative))
              select(root / relative)
          for pattern in ('.generated/*-results.json', 'verification/v15/**/*-results.json', 'verification/v15/**/*.log', 'verification/v15/**/*click-diagnostics.json', 'verification/v15/**/*trace*', 'verification/storytelling-diagnostics-off/*.json', 'verification/storytelling-diagnostics-off/*.log'):
              for path in root.glob(pattern):
                  if path.is_file():
                      select(path)
          files = [{'path':str(path.relative_to(root)), 'bytes':path.stat().st_size, 'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(selected)]
          excluded = [{'path':str(path.relative_to(root)), 'bytes':path.stat().st_size} for path in sorted((root / 'verification/v15').rglob('*')) if path.is_file() and path not in selected]
          manifest = {'scope':'Optional core artifact only; original complete artifact is retained separately.', 'selection':'HTML, package lock, every available registered result plus result/log/trace/progress evidence; bulk exports, screenshots and unrelated generated data excluded.', 'separateArtifactScopes':[{'name':'wildlands-godot-export','scope':'Independent Godot job conformance and native frame; this primary-job archive contains only locally present evidence.'}], 'gateStatus':gate.get('status'), 'attemptedSuites':len(gate.get('suites', [])), 'missingEvidence':sorted(set(missing)), 'payloadBytes':sum(row['bytes'] for row in files), 'zipLimitBytes':30*1024*1024, 'files':files, 'excludedFromCore':excluded}
          archive = output / 'littlewild-core-evidence.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zipped:
              for row in files:
                  zipped.write(root / row['path'], row['path'])
              zipped.writestr('CORE-MANIFEST.json', json.dumps(manifest, indent=2)+'\n')
          manifest['zipBytes'] = archive.stat().st_size
          manifest['status'] = 'available' if manifest['zipBytes'] < manifest['zipLimitBytes'] else 'unavailable-size-limit'
          if manifest['status'] != 'available':
              archive.unlink()
          else:
              manifest['zipSha256'] = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / 'core-evidence-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(json.dumps({key:manifest[key] for key in ('status','gateStatus','attemptedSuites','payloadBytes','zipBytes','zipLimitBytes','missingEvidence')}, indent=2))
          PY
      - name: Retain optional bounded core verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: littlewild-ecs-core-evidence
          path: source/wildlands/verification/core-evidence/*.zip
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Retain compact verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: littlewild-ecs-diagnostics
          path: |
            source/wildlands/package-lock.json
            source/wildlands/.generated/*-results.json
            source/wildlands/verification/v15/*gate-results.json
            source/wildlands/verification/v15/*click-diagnostics.json
            source/wildlands/verification/v15/*.log
            source/wildlands/verification/v15/*-results.json
            source/wildlands/verification/v15/*building-interiors-browser.json
            source/wildlands/verification/v15/*progress.json
            source/wildlands/verification/core-evidence/*.json
            source/wildlands/verification/storytelling-diagnostics-off/*.json
            source/wildlands/verification/storytelling-diagnostics-off/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: littlewild-ecs-verification
          path: |
            source/wildlands/package-lock.json
            source/wildlands/littlewild.html
            source/wildlands/verification/v15/
            source/wildlands/verification/storytelling-diagnostics-off/
            source/wildlands/.generated/*-results.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  godot-export:
    name: Wildlands Godot export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
      LP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/wildlands/package-lock.json
      - name: Install virtual display and pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/wildlands-godot.zip
          unzip -q /tmp/wildlands-godot.zip -d /tmp/wildlands-godot
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  /tmp/wildlands-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" | sha256sum --check
          chmod +x /tmp/wildlands-godot/Godot_*
      - name: Build the separate Wildlands project
        working-directory: source/wildlands
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Verify playable export and capture native frame
        working-directory: source/wildlands
        shell: bash
        run: |
          set -euo pipefail
          WILDLANDS_GODOT="/tmp/wildlands-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
          WILDLANDS_CAPTURE_NATIVE="$PWD/.generated/wildlands-native.png" \
          xvfb-run -a npm run verify:godot --silent
      - name: Retain export conformance and native frame
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildlands-godot-export
          path: |
            source/wildlands/.generated/wildlands-godot-*.json
            source/wildlands/.generated/wildlands-native.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
