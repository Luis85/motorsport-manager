              {"suite":"rts-browser","name":"Isometric battlefield renders at desktop and mobile sizes with keyboard controls and no horizontal overflow"},
              {"suite":"rts-browser","name":"Leaving RTS retires its surface, restores the invoker focus, and reopening retains a single checkpoint"},
              {"suite":"rts-browser","name":"Self-contained RTS loading and interaction generate no script errors or network requests"},
              {"suite": "rts-mission-editor", "name": "Mission editor queries and exported catalogs are detached from each other and admitted input"},
              {"suite": "rts-mission-editor", "name": "Mission editor rejects stale intents without changing revision draft or history"},
              {"suite": "rts-mission-editor", "name": "Mission editor undo redo advance revisions and a new branch invalidates redo"},
              {"suite": "rts-mission-editor", "name": "Mission editor history retains at most sixty four accepted catalog changes"},
              {"suite": "rts-mission-editor", "name": "Mission editor equivalent metadata selection and import preserve revision and redo history"},
              {"suite": "rts-mission-editor", "name": "Mission editor metadata commits a complete validated mission and rejects unsafe resizing"},
              {"suite": "rts-mission-editor", "name": "Mission editor terrain painting overwrites cells while preserving unaffected terrain and supports undo"},
              {"suite": "rts-mission-editor", "name": "Mission editor rejects terrain bounds incompatible actors and blocked building footprints atomically"},
              {"suite": "rts-mission-editor", "name": "Mission editor places updates and removes unit building and creature spawn records"},
              {"suite": "rts-mission-editor", "name": "Mission editor rejects expanded off map actors forbidden movement and overlapping building placement"},
              {"suite": "rts-mission-editor", "name": "Mission editor authors deposits item drops and all registered objective types"},
              {"suite": "rts-mission-editor", "name": "Mission editor record commands reject bad indices references payload shapes and unsafe amounts"},
              {"suite": "rts-mission-editor", "name": "Mission editor cloning removal and history preserve other missions and catalog families"},
              {"suite": "rts-mission-editor", "name": "Mission editor selection invalidates gestures without adding undo history or dirty content"},
              {"suite": "rts-mission-editor", "name": "Mission editor whole catalog import is detached undoable and rejects incomplete catalogs"},
              {"suite": "rts-mission-editor", "name": "Mission editor rejects executable getters cycles symbols and unknown actions before reading behavior"},
              {"suite": "rts-mission-editor", "name": "Mission editor catalog limits reject excess actors and preserve accepted history"},
