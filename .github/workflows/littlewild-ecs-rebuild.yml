              {"suite":"definition-source","name":"Legacy asset and creature manifests cannot become a second editable authority"},
              {"suite":"definition-source","name":"Catalog order rejects missing facets and duplicate IDs instead of silently dropping data"},
              {"suite":"definition-source","name":"Inline gameplay tables are rejected as competing definitions"},
              {"suite":"definition-source","name":"Wrong family, facet identity, typo, missing file and empty definitions fail discovery"},
              {"suite":"definition-source","name":"A gameplay definition without its required visual model fails before build publication"},
