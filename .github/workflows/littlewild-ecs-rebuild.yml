# ECS milestone transport uses independently hashed PR-comment chunks.
name: Littlewild ECS rebuild
on:
  push:
    branches:
      - concept/littlewild-v15-world-ui
    paths:
      - 'docs/concepts/littlewild/source/**'
      - 'docs/concepts/littlewild/verify-v15.py'
      - 'docs/concepts/littlewild/*.md'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
permissions:
  contents: write
  issues: read
jobs:
  verify-and-rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: concept/littlewild-v15-world-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and apply chunked ECS milestone
        id: milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues/25/comments?per_page=100" --paginate --slurp > /tmp/milestone-comment-pages.json
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, subprocess

          pages = json.loads(Path('/tmp/milestone-comment-pages.json').read_text())
          comments = [comment for page in pages for comment in page]
          meta_marker = '<!-- ecs-milestone-chunk-meta -->'
          meta_comments = [comment for comment in comments if meta_marker in comment.get('body', '')]
          if not meta_comments:
              raise SystemExit('No chunked milestone metadata found.')
          payload = json.loads(meta_comments[-1]['body'].split(meta_marker, 1)[1].strip())
          required = {
              'transport': 'm4-0c761acb',
              'milestone': 'M4',
              'base': '60dc144ae6dc40a31ba16cade9e67845fb0e23c3',
              'sha256': '0c761acb1d04fb7a1e6042aa7523cd34a564d718510ab8e4cfc310115481bc78',
              'gzipSha256': '146b36c07495c0f1c26f8ed0fb3de0173aba7a29b3d5981858a013e5e2a2365b',
              'encoding': 'gzip+base64-chunks',
              'chunks': 12,
              'encodedChars': 34348,
          }
          for key, value in required.items():
              if payload.get(key) != value:
                  raise SystemExit(f'Unexpected chunked payload {key}: {payload.get(key)!r}')
          hashes = payload.get('chunkSha256')
          if not isinstance(hashes, list) or len(hashes) != payload['chunks']:
              raise SystemExit('Invalid chunk checksum manifest.')

          prefix = f"<!-- ecs-milestone-chunk:{payload['transport']}:"
          chunks = {}
          for comment in comments:
              body = comment.get('body', '')
              if not body.startswith(prefix):
                  continue
              head, data = body.split('-->', 1)
              index = int(head[len(prefix):].strip())
              chunks[index] = data.strip()
          expected_indices = list(range(payload['chunks']))
          if sorted(chunks) != expected_indices:
              raise SystemExit(f'Incomplete milestone chunks: {sorted(chunks)}')
          for index in expected_indices:
              digest = hashlib.sha256(chunks[index].encode()).hexdigest()
              if digest != hashes[index]:
                  raise SystemExit(f'Milestone chunk {index} checksum mismatch: {digest}')

          encoded = ''.join(chunks[index] for index in expected_indices)
          if len(encoded) != payload['encodedChars']:
              raise SystemExit(f'Encoded milestone length mismatch: {len(encoded)}')
          compressed = base64.b64decode(encoded, validate=True)
          compressed_digest = hashlib.sha256(compressed).hexdigest()
          if compressed_digest != payload['gzipSha256']:
              raise SystemExit(f'Compressed milestone checksum mismatch: {compressed_digest}')
          patch = gzip.decompress(compressed)
          patch_digest = hashlib.sha256(patch).hexdigest()
          if patch_digest != payload['sha256']:
              raise SystemExit(f'Milestone patch checksum mismatch: {patch_digest}')

          subprocess.run(['git', 'merge-base', '--is-ancestor', payload['base'], 'HEAD'], check=True)
          patch_path = Path('/tmp/littlewild-milestone.patch')
          patch_path.write_bytes(patch)
          state_path = Path('docs/concepts/littlewild/source/ecs-milestone-state.json')
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          if state.get('sha256') != payload['sha256']:
              subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
              subprocess.run(['git', 'apply', str(patch_path)], check=True)
              state_path.write_text(json.dumps({
                  'milestone': payload['milestone'],
                  'sha256': payload['sha256'],
              }, indent=2) + '\n')
          Path('/tmp/milestone-message').write_text(payload['commitMessage'])
          PY
          echo "message=$(cat /tmp/milestone-message)" >> "$GITHUB_OUTPUT"
      - name: Preserve recovered patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlewild-m4-recovered-patch
          path: /tmp/littlewild-milestone.patch
          if-no-files-found: ignore
          retention-days: 14
      - name: Install verification dependencies
        working-directory: docs/concepts/littlewild
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
      - name: Verify source and rebuild standalone artifact
        working-directory: docs/concepts/littlewild
        run: python verify-v15.py
      - name: Commit milestone and verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/concepts/littlewild
          if git diff --cached --quiet; then
            echo 'Sources and generated outputs already current.'
          else
            git commit -m '${{ steps.milestone.outputs.message }}'
            git push
          fi
