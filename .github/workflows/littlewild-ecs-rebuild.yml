              {"suite": "rts-mission-editor-browser", "name": "Deposit item and objective forms retain authored records in the complete catalog"},
              {"suite": "rts-mission-editor-browser", "name": "Rejected editor JSON imports preserve the whole draft history and retained match"},
              {"suite": "rts-mission-editor-browser", "name": "Mission catalog download and validated import round-trip every authored family"},
              {"suite": "rts-mission-editor-browser", "name": "Editor map remains rendered accessible and contained at desktop and mobile widths"},
              {"suite": "rts-mission-editor-browser", "name": "Editor return retires its surface restores focus and retains the draft on reopening"},
