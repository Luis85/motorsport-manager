              {"suite":"rts-tools","name":"Catalog outputs are detached and whole-catalog validation rejects missing archetypes"},
              {"suite":"rts-tools","name":"Mission completion reports actual early-stop tick instead of requested duration"},
              {"suite":"rts-tools","name":"Hostile accessors and cyclic recipes reject without invoking imported getters"},
              {"suite":"rts-tools","name":"JSON checkpoint exchange produces identical deterministic continuation"},
              {"suite":"rts-tools","name":"CLI refuses output-over-input writes and preserves original input bytes"},
