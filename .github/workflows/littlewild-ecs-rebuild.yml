name: Littlewild ECS verification
on:
  push:
    branches:
      - concept/littlewild-v15-world-ui
    paths:
      - 'docs/concepts/littlewild/**'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
  pull_request:
    paths:
      - 'docs/concepts/littlewild/**'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: littlewild-ecs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        working-directory: docs/concepts/littlewild
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
      - name: Rebuild and verify all Littlewild contracts
        working-directory: docs/concepts/littlewild
        run: python verify-v15.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlewild-ecs-verification
          path: |
            docs/concepts/littlewild/littlewild.html
            docs/concepts/littlewild/verification/v15/
            docs/concepts/littlewild/source/*-results.json
          if-no-files-found: error
          retention-days: 14
