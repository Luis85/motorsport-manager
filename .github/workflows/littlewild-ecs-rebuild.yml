# ECS M4 canonical payload recovery
name: Littlewild ECS rebuild
on:
  push:
    branches:
      - concept/littlewild-v15-world-ui
    paths:
      - 'docs/concepts/littlewild/source/**'
      - 'docs/concepts/littlewild/verify-v15.py'
      - 'docs/concepts/littlewild/*.md'
      - '.github/workflows/littlewild-ecs-rebuild.yml'
permissions:
  contents: write
  issues: read
jobs:
  verify-and-rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: concept/littlewild-v15-world-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and apply canonical M4 payload
        id: milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues/comments/5919816854" > /tmp/milestone-comment.json
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, subprocess

          marker = '<!-- ecs-milestone-payload -->'
          comment = json.loads(Path('/tmp/milestone-comment.json').read_text())
          body = comment.get('body', '')
          if marker not in body:
              raise SystemExit('Canonical M4 comment does not contain a milestone payload.')
          payload = json.loads(body.split(marker, 1)[1].strip())
          expected = {
              'milestone': 'M4',
              'base': '60dc144ae6dc40a31ba16cade9e67845fb0e23c3',
              'sha256': '0c761acb1d04fb7a1e6042aa7523cd34a564d718510ab8e4cfc310115481bc78',
              'encoding': 'gzip+base64',
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f'Unexpected canonical payload {key}: {payload.get(key)!r}')
          subprocess.run(['git', 'merge-base', '--is-ancestor', payload['base'], 'HEAD'], check=True)
          compressed = base64.b64decode(payload['payload'], validate=True)
          patch = gzip.decompress(compressed)
          digest = hashlib.sha256(patch).hexdigest()
          if digest != payload['sha256']:
              raise SystemExit(f'Milestone payload checksum mismatch: {digest}')
          patch_path = Path('/tmp/littlewild-milestone.patch')
          patch_path.write_bytes(patch)
          state_path = Path('docs/concepts/littlewild/source/ecs-milestone-state.json')
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          if state.get('sha256') != payload['sha256']:
              subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
              subprocess.run(['git', 'apply', str(patch_path)], check=True)
              state_path.write_text(json.dumps({
                  'milestone': payload['milestone'],
                  'sha256': payload['sha256'],
              }, indent=2) + '\n')
          Path('/tmp/milestone-message').write_text(payload['commitMessage'])
          PY
          echo "message=$(cat /tmp/milestone-message)" >> "$GITHUB_OUTPUT"
      - name: Preserve recovered patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlewild-m4-recovered-patch
          path: /tmp/littlewild-milestone.patch
          if-no-files-found: ignore
          retention-days: 14
      - name: Install verification dependencies
        working-directory: docs/concepts/littlewild
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
      - name: Verify source and rebuild standalone artifact
        working-directory: docs/concepts/littlewild
        run: python verify-v15.py
      - name: Commit milestone and verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/concepts/littlewild
          if git diff --cached --quiet; then
            echo 'Sources and generated outputs already current.'
          else
            git commit -m '${{ steps.milestone.outputs.message }}'
            git push
          fi
