name: Godot verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shards:
    name: suites-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      GODOT_VERSION: 4.7.2
      LP_NUM_THREADS: 2
      MOTORSPORT_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the native virtual-display and OpenGL ES runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" | sha256sum --check
          chmod +x /tmp/godot/Godot_*
          sudo ln -s /tmp/godot/Godot_* /usr/local/bin/godot
          godot --version
      - name: Verify registered shard
        run: python3 scripts/verify.py --shard-index ${{ matrix.shard }} --shard-count 6
      - name: Retain evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-shard-${{ matrix.shard }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
  verify:
    name: verify
    if: always()
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download digest-verified evidence from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/download_artifacts.py
          --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"
          --source "${{ github.event.pull_request.head.sha || github.sha }}"
          --name verification-shard-0 --name verification-shard-1 --name verification-shard-2
          --name verification-shard-3 --name verification-shard-4 --name verification-shard-5
          --nested --output /tmp/evidence
      - name: Require all shards and exact registered coverage
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
        run: |
          test "$SHARD_RESULT" = success
          python3 scripts/verify.py --aggregate /tmp/evidence --shard-count 6
