name: Godot verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: godot-verification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
      LP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Record verification source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o /tmp/verification-source.zip
          git rev-parse HEAD > /tmp/verification-source.sha
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          sudo ln -s /tmp/godot/Godot_* /usr/local/bin/godot
          godot --version
      - name: Import and test
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project.godot ]; then
            python3 scripts/verify.py
          else
            echo 'Repository bootstrap: project follows in the next implementation commit.'
          fi
      - name: Verification runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-runtime
          path: /tmp/godot/Godot_*
          if-no-files-found: ignore
          retention-days: 1
      - name: Exact verification source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-source
          path: |
            /tmp/verification-source.zip
            /tmp/verification-source.sha
          if-no-files-found: ignore
          retention-days: 1
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
