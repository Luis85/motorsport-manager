name: Publish verified view and clock boundaries
on:
  push:
    branches: ['refactor/composable-systems-weekend-flow']
    paths: ['.handoff/view-boundaries/part-0.patch']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Luis85/motorsport-manager' && github.event.before == '907c2c309a8ca335ac0379b37196e352e9478b68'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify readable patches and exact resulting source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 907c2c309a8ca335ac0379b37196e352e9478b68
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          hashes = [
              '631a2e3617f668c5e3b145a0f6832f6dda018dbc7132294563b25f74721c8cf4',
              '48894489b61dfb8fe8ce6d766c0f5cdfba266d7ee6a3f748553e418daffc698d',
              'ee65bb68369f9f16804d1b571c8dfad992df96b261ff4c165e97ecf2d8a23bbf',
          ]
          parts = []
          for index, expected in enumerate(hashes):
              data = Path(f'.handoff/view-boundaries/part-{index}.patch').read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected
              parts.append(data)
          patch = b''.join(parts)
          assert hashlib.sha256(patch).hexdigest() == 'c88ea23520bcb0b4d7ad272c519f02959d743c9dac556c8bbbf9398d4b561779'
          Path('/tmp/view-boundaries.patch').write_bytes(patch)
          PY
          git apply --index --check --unidiff-zero /tmp/view-boundaries.patch
          git apply --index --unidiff-zero /tmp/view-boundaries.patch
          git rm -r .handoff/view-boundaries .github/workflows/publish-view-boundaries.yml
          git diff --cached --check
          test "$(git write-tree)" = 3abebd0a15d66de8968c455f6a779c45afcaf493
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: remove clock and aggregate lifetime authority from view handles'
          git push origin HEAD:refs/heads/refactor/composable-systems-weekend-flow
