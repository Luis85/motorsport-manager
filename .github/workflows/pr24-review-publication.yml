name: PR24 reviewed-source publication
on:
  push:
    branches: [chore/pr24-review-transport-3f3e713b]
    paths: [.github/workflows/pr24-review-publication.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_BASE: 4a5855b15599d176fe883335208c8563286de3a4
      EXPECTED_TREE: 3f3e713bfcdd7c58768beaf38a827253afeec595
      CODE_TREE: 8b2252b613e9b2c759ad2dbbf1ac0d83912f1080
      RESULT_BRANCH: chore/pr24-reviewed-source-3f3e713b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join((Path('.github/pr24-review-transport') / f'{i}.b64').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '366a03e99b5c0b2f0ab717d79087625e28c42c4d0f92818985c208a150adb43e'
          Path('/tmp/pr24-reviewed.patch').write_bytes(patch)
          PY
      - name: Reconstruct exact tested source without transport ancestry
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git apply --check --unidiff-zero /tmp/pr24-reviewed.patch
          git apply --index --unidiff-zero /tmp/pr24-reviewed.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 -m unittest discover -s tests -p test_content_hardening.py -v
          python3 -m unittest discover -s tests -p test_json_number_fixtures.py -v
          python3 scripts/check_architecture.py
          # The connected contents API publishes the workflow separately; the
          # Actions token must not be used to grant itself workflow-write access.
          git checkout "$EXPECTED_BASE" -- .github/workflows/content.yml
          test "$(git write-tree)" = "$CODE_TREE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(content): harden multi-pack authoring and freeze registered mechanic profiles' -m 'Expose wheel operating coefficients with exact legacy defaults, bind profile metadata to replay manifests, and reject incompatible versions. Preserve concurrent numeric fixture hardening. Source tree verified against the locally reviewed tree; final content workflow is published separately through the connected API. No baseline weakening or changes to main.'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          mkdir -p /tmp/pr24-publication
          git rev-parse HEAD > /tmp/pr24-publication/commit.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr24-publication/tree.txt
          git diff --stat HEAD^ HEAD > /tmp/pr24-publication/changes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr24-reviewed-source-publication
          path: /tmp/pr24-publication/
          if-no-files-found: error
          retention-days: 2
