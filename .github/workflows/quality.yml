name: Advisory code quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Code quality (warnings only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        id: tools
        continue-on-error: true
        run: python -m pip install -r requirements-quality.txt
      - name: Test advisory checker
        id: self_tests
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/quality
          python -m unittest discover -s tests -p 'test_quality*.py' > reports/quality/self-tests.log 2>&1
      - name: Run advisory checks
        id: report
        if: always()
        continue-on-error: true
        run: python scripts/quality.py --annotations
      - name: Compare full inventory with base revision
        if: always()
        continue-on-error: true
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_REVISION"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$base"
          python scripts/quality.py --root "$RUNNER_TEMP/quality-base" --output reports/quality/base
          python scripts/quality_delta.py --base-report reports/quality/base/quality.json --candidate-report reports/quality/quality.json --output reports/quality/comparison
          cat reports/quality/comparison/delta.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report infrastructure problems
        if: always()
        env:
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          SELF_TEST_OUTCOME: ${{ steps.self_tests.outcome }}
        run: |
          if [ "$SELF_TEST_OUTCOME" != success ]; then
            echo '::warning title=Quality checker tests failed::Checker regression tests did not pass. Inspect self-tests.log; a successful advisory job is not proof of a working checker.'
            echo '## Quality checker regression tests failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Inspect self-tests.log in the quality-report artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$TOOLS_OUTCOME" != success ]; then
            echo '::warning title=Quality tools unavailable::Tool installation did not complete. Analysis may be incomplete; this is not a clean result.'
          fi
          if [ "$REPORT_OUTCOME" != success ] || [ ! -f reports/quality/quality.json ]; then
            echo '::warning title=Quality report unavailable::Advisory checks did not produce a complete report. Investigate the job log.'
            echo '## Advisory quality unavailable' >> "$GITHUB_STEP_SUMMARY"
            echo 'The advisory runner did not complete. No clean result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: quality-report
          path: reports/quality/
          if-no-files-found: warn
          retention-days: 14
