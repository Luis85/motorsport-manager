name: Littlewild ECS refactor
on:
  push:
    branches:
      - refactor/pr25-ecs-foundation
  pull_request:
    paths:
      - 'docs/concepts/littlewild/**'
      - '.github/workflows/littlewild-ecs.yml'
jobs:
  ecs-and-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild self-contained HTML from modified source
        working-directory: docs/concepts/littlewild
        run: python source/build.py
      - name: ECS and existing Node gameplay regressions
        working-directory: docs/concepts/littlewild
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            test-ecs.cjs \
            test-v15.cjs \
            test-v15-presentation.cjs \
            test-v15-pause.cjs \
            test-v11.cjs \
            test-v10.cjs \
            test-growth-stress.cjs \
            test-fresh-v10.cjs \
            test-v10-regression-v5.cjs \
            test-v10-regression-v6.cjs \
            test-v10-regression-v8.cjs \
            test-v10-regression-quality-v9.cjs \
            test-v10-regression-foundation-v9.cjs; do
            echo "::group::$suite"
            node "source/$suite"
            echo "::endgroup::"
          done
      - name: Schema and content authoring checks
        working-directory: docs/concepts/littlewild
        run: |
          python -m pip install -r requirements-test.txt
          python source/schema-checks-v10.py
          python source/schema-checks-v15.py
      # The archived v15 release gate pins a now-intentionally modified colony.js
      # SHA. Run source behavioral suites here; create a new publication record
      # after this refactor's own release/browsers have been independently verified.
