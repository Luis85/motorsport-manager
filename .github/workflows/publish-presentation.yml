name: Publish verified detached presentation
on:
  push:
    branches: ['refactor/composable-systems-weekend-flow']
    paths: ['.handoff/presentation/part-0.b64']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Luis85/motorsport-manager' && github.event.before == 'a965eaed840f22778259fee3f7ef70284e784734'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish only the pinned locally verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a965eaed840f22778259fee3f7ef70284e784734
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          hashes = ['05201e40ae084c2d3644a9231d0df9cb50506375', '95cf7394423b3841fd67d43d1d74de358592dc42', 'e7ec28ada3a0483edc947cfc236e61a2dd17eb2f', '2da0e1442fc12f71c52313da3934006a3cef41c3']
          parts = []
          for i, expected in enumerate(hashes):
              data = pathlib.Path(f'.handoff/presentation/part-{i}.b64').read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
              parts.append(data)
          patch = lzma.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '21c3024bbd19895e436ebf05e72aa2eb7bc312c90aa3ab609caaa9c08bd62caf'
          pathlib.Path('/tmp/presentation.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --index --check /tmp/presentation.patch
          git apply --unidiff-zero --index /tmp/presentation.patch
          git rm -r .handoff .github/workflows/publish-presentation.yml
          git diff --cached --check
          test "$(git write-tree)" = 07774b669ff653c11773a692e47defcdeb1fbdf4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: enforce detached presentation and pure track-domain boundaries'
          git push origin HEAD:refs/heads/refactor/composable-systems-weekend-flow
