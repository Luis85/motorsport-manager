name: Verify main and content integration
on:
  push:
    branches: [chore/data-driven-main-reconcile-9683b423]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact reviewed source
        run: |
          cp reconcile.py /tmp/reconcile.py
          python3 /tmp/reconcile.py
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify native integration
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          python3 scripts/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --suite command_responsibility_tests --suite content_tyre_tests --suite reproduction_tests --suite editor_gesture_tests
      - name: Publish verified source without rewriting either history
        run: |
          test "$(git write-tree)" = 9683b423280d05f7298de97cb807f7c7069f4dcb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'merge: preserve runtime confidence and external content contracts' | git commit-tree 9683b423280d05f7298de97cb807f7c7069f4dcb -p 712b6071412fae89671deb1ceca5d690c9f02c04 -p 52415ed3c2afa3b89b182e3e7cb25a477ab20f6a)
          git push origin "$commit:refs/heads/chore/data-driven-main-integrated-9683b423"
          printf 'Published commit: %s\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-content-integration
          path: reports/
