name: Publish verified typed-car source
on:
  push:
    branches: ['refactor/composable-systems-weekend-flow']
    paths: ['.handoff/typed-cars/part-0.patch']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Luis85/motorsport-manager' && github.event.before == '5ca414e9e311652e46d34a7149ac73125fe32482'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify readable patches and exact resulting source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5ca414e9e311652e46d34a7149ac73125fe32482
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          hashes = [
              'fbd7bc30529199dae9c626af3d63b976d2728d8bc891fa5b32ce8a0b82ffcc76',
              '6c78b684c4ccca6662f8d56521afe85094cfedbe6f7f81b9723be979f3e97da5',
              'cece9178a9425638529ee4bd332b7759c7953626db6eaede12de9789e556bc6d',
          ]
          parts = []
          for index, expected in enumerate(hashes):
              data = Path(f'.handoff/typed-cars/part-{index}.patch').read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected
              parts.append(data)
          # Correct two explicitly identified transport transcription errors,
          # then verify the original locally tested patch, not an approximate edit.
          patch = b''.join(parts)
          patch = patch.replace(
              b'@@ -239 +239 @@ func incident(sim: RaceSim, c: Dictionary, old: Array) -> void:',
              b'@@ -239 +239 @@ func incident(sim: RaceSim, c: Dictionary) -> void:')
          patch = patch.replace(
              b'+static func advance(r: RaceCar, c: RaceCar, dt: float, stochastic: bool) -> Dictionary:',
              b'+static func advance(r: Dictionary, c: RaceCar, dt: float, stochastic: bool) -> Dictionary:')
          assert hashlib.sha256(patch).hexdigest() == 'e66c345fa7b424f785e472f3d74a1154189fe4d5ea0375015f7cb872186368d4'
          Path('/tmp/typed-cars.patch').write_bytes(patch)
          PY
          git apply --index --check --unidiff-zero /tmp/typed-cars.patch
          git apply --index --unidiff-zero /tmp/typed-cars.patch
          git rm -r .handoff/typed-cars .github/workflows/publish-typed-cars.yml
          git diff --cached --check
          test "$(git write-tree)" = 6ac8448b01b06dfa531c99fe48449770d24c369c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: use typed entrants throughout simulation and detached presentation'
          git push origin HEAD:refs/heads/refactor/composable-systems-weekend-flow
