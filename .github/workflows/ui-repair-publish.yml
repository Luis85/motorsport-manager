name: Publish verified UI repair
on:
  push:
    branches: [feat/race-weekend-ui-overhaul]
    paths: [.github/ui-repair.payload.json]
permissions:
  contents: write
concurrency:
  group: one-time-ui-repair-publication
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Luis85/motorsport-manager' && github.ref == 'refs/heads/feat/race-weekend-ui-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/race-weekend-ui-overhaul
          fetch-depth: 0
      - name: Validate and publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'cc1b90dbba07bbb35160e3c46a6257305660bf8f'
          parts = [f'.github/ui-repair.part-{i}.txt' for i in range(1, 4)]
          temporary = {'.github/ui-repair.payload.json', '.github/workflows/ui-repair-publish.yml', *parts}
          if git('branch', '--show-current') != 'feat/race-weekend-ui-overhaul':
              raise SystemExit('Unexpected branch; no write performed')
          changed = set(git('diff', '--name-only', base, 'HEAD').splitlines())
          if changed - temporary:
              raise SystemExit('Concurrent source changes detected; refusing to overwrite them')
          payload = json.loads(pathlib.Path('.github/ui-repair.payload.json').read_text())
          encoded = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          if len(encoded) != 30728 or payload['base_commit'] != base:
              raise SystemExit('Unexpected repair size or baseline')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if len(patch) > 200000 or hashlib.sha256(patch).hexdigest() != '02c00a87162bd5ad2cb2b956b56987e7038f483c203266bf35c760295aa90b39':
              raise SystemExit('Patch digest mismatch')
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=patch, check=True)
          staged = git('diff', '--cached', '--name-only').splitlines()
          if not staged or any(not (p.startswith(('scripts/ui/', 'tests/', 'docs/')) or p == 'scripts/verify.py') for p in staged):
              raise SystemExit('Patch changed an unexpected path; no commit or push')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['python3', '-m', 'py_compile', 'scripts/verify.py'], check=True)
          subprocess.run(['git', 'rm', '.github/ui-repair.payload.json', *parts], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(ui): repair native Godot import, composition, evidence and responsive regressions'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/race-weekend-ui-overhaul'], check=True)
          print('Published repair:', git('rev-parse', 'HEAD'))
          PY
