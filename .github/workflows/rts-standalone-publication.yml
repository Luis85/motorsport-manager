name: Publish RTS standalone build
on:
  push:
    branches: [feature/ecs-rts-demo]
    paths: [.github/workflows/rts-standalone-publication.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Luis85/motorsport-manager' && github.ref == 'refs/heads/feature/ecs-rts-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/concepts/littlewild/package-lock.json
      - name: Compile authoritative RTS sources
        working-directory: docs/concepts/littlewild
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Publish only the generated standalone
        run: |
          git add -- docs/concepts/littlewild/littlewild.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate standalone with ECS RTS demo'
          git push origin HEAD:feature/ecs-rts-demo
