name: Verify frozen tuning and weekend integration
on:
  push:
    branches: [chore/content-tuning-df7d2420-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
      BASE_COMMIT: 4328290343ee8160a31e8470bb170ae04a8bfdea
      EXPECTED_TREE: df7d2420f3a1018459b1d6ae146da3bf4674bf35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct the source-bound implementation
        shell: bash
        run: |
          set -euo pipefail
          cat payload.part0.xz payload.part1.xz payload.part2.xz payload.part3.xz payload.part4.xz payload.part5.xz > /tmp/content.patch.xz
          echo '66f756e388a05f265f72766ccb5645a95a9e3264e48b9d08fa3cf76fab9f2020  /tmp/content.patch.xz' | sha256sum --check
          xz -dc /tmp/content.patch.xz > /tmp/content.patch
          echo '75f62be9d97f5f20a8180705653633ccb70fb90a969bc48587db42f4d4c5e279  /tmp/content.patch' | sha256sum --check
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/content.patch
          git apply --index /tmp/content.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify native tuning, save and setup contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/content.py schemas --check --godot "$godot"
          python3 scripts/verify.py --godot "$godot" --suite content_tuning_tests --suite content_weekend_ui_tests --suite recovery_tests --suite weekend_launch_tests
      - name: Publish verified source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): freeze shared race tuning and named weekend presets across launch, forecasts and saves' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/content-tuning-df7d2420-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuning-weekend-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 14
