name: Verify frozen environment content
on:
  push:
    branches: [chore/content-environment-e688d61b-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
      BASE_COMMIT: 177aa7911fbf0c614ec0885ab770cd436673dea4
      EXPECTED_TREE: e688d61b651248ccc42d310e1ec6109856fed887
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact environment source
        shell: bash
        run: |
          set -euo pipefail
          cat payload.part0.xz payload.part1.xz payload.part2.xz payload.part3.xz payload.part4.xz payload.part5.xz > /tmp/content.patch.xz
          echo 'dddd25ea88f47242465f744a7ae44fd284d95bf128ae0631ee22fd53ea687890  /tmp/content.patch.xz' | sha256sum --check
          xz -dc /tmp/content.patch.xz > /tmp/content.patch
          echo 'a18936e331dcced7603cb1cf1bc34fb33f453805763ee64d471c11bea4b6e010  /tmp/content.patch' | sha256sum --check
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/content.patch
          git apply --index /tmp/content.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify environment, compatibility and native views
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/content.py schemas --check --godot "$godot"
          python3 scripts/verify.py --godot "$godot" --suite content_environment_tests --suite content_tuning_tests --suite content_performance_tests --suite weather_tests --suite weather_ui_smoke --suite content_weekend_ui_tests --suite architecture_characterization
      - name: Publish only the verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): externalize frozen weather, surface and public forecast tuning' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/content-environment-e688d61b-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-content-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 14
