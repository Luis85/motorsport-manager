name: Publish verified vehicle integration
on:
  push:
    branches: [chore/data-driven-vehicle-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAYLOAD_COMMIT: 3742f91a1c6ee26a14e3e500ccf6edd450dbc38a
      EXPECTED_TREE: 46977967d2a38492c8de8a6da3ce401ac0157b9f
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally verified integration
        shell: bash
        run: |
          set -euo pipefail
          cp integration.patch /tmp/integration.patch
          sed -i 's/begins_with("--content-pack=")):/begins_with("--content-pack="):/' /tmp/integration.patch
          echo '1c023aa67f5b6fc1390ba710fa06221456c2f9806c3625f76318f03a5f1f8914  /tmp/integration.patch' | sha256sum --check
          git checkout --detach "$PAYLOAD_COMMIT"
          git apply --unidiff-zero --check /tmp/integration.patch
          git apply --unidiff-zero --index /tmp/integration.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p test_content_authoring.py
      - name: Run production content verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          python3 scripts/content.py schemas --check --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --suite content_tests --suite content_pack_tests --suite weekend_launch_tests
      - name: Publish only the verified tree to a temporary result branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): integrate frozen vehicle definitions across launch, editor, saves and replay' | git commit-tree "$EXPECTED_TREE" -p "$PAYLOAD_COMMIT")
          git push origin "$commit:refs/heads/chore/data-driven-vehicle-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-integration-verification
          path: reports/
          if-no-files-found: warn
