name: Verify complete roster integration
on:
  push:
    branches: [chore/data-driven-roster-complete-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_COMMIT: c80f8922e8e804d99ad7c201ee7b9984c8f90e37
      EXPECTED_TREE: fe8df43c88ebe3c099ddf986b08cd3d7dfe65587
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact roster source on its verified base
        shell: bash
        run: |
          set -euo pipefail
          cat roster.part0.xz roster.part1.xz > /tmp/roster.patch.xz
          echo '9b695b64c9fc7bd20a06d46822d481b792fa2d59976d12e63cd6d64662609a2e  /tmp/roster.patch.xz' | sha256sum --check
          xz -dc /tmp/roster.patch.xz > /tmp/roster.patch
          git checkout --detach "$BASE_COMMIT"
          git apply --unidiff-zero --check /tmp/roster.patch
          git apply --unidiff-zero --index /tmp/roster.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p test_content_authoring.py
      - name: Verify real content and native interfaces
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          python3 scripts/content.py schemas --check --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --suite architecture_characterization --suite editor_session_tests --suite weekend_launch_tests --suite content_tests --suite content_pack_tests --suite content_roster_tests --suite content_roster_ui_tests
      - name: Publish only the checked source tree to the result branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): externalize teams and driver rosters across simulation, saves and native views' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/data-driven-roster-complete-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-roster-integration-verification
          path: reports/
          if-no-files-found: warn
