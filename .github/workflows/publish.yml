name: Verify and publish authored circuit continuation
on:
  push:
    branches: [chore/content-circuits-742d0672-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
      BASE_COMMIT: 4234c71be310585aedbdda53fa786a48a581cce1
      EXPECTED_TREE: 59179981824032ce3fea34acc57d64f475bd6b71
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct the exact recovered source
        shell: bash
        run: |
          set -euo pipefail
          cat payload.part0.xz payload.part1.xz payload.part2.xz payload.part3.xz payload.part4.xz payload.part5.xz > /tmp/content.patch.xz
          echo '8dfe1ea96e207b1bc18a94288e675d73e67dc682101bb4f9d99c8cabf61690d0  /tmp/content.patch.xz' | sha256sum --check
          xz -dc /tmp/content.patch.xz > /tmp/content.patch
          echo 'd26a703642dcd868720585cfa503e80992eb2cb5706d83b3cd84d55cb690dbc3  /tmp/content.patch' | sha256sum --check
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/content.patch
          git apply --index /tmp/content.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 scripts/check_architecture.py
      - name: Install the repository-pinned engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          echo 'GODOT_BINARY=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64' >> "$GITHUB_ENV"
          echo 'VERIFICATION_TEST_GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64' >> "$GITHUB_ENV"
      - name: Verify authoring, persistence and native launch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/content.py schemas --check --godot "$GODOT_BINARY"
          python3 scripts/verify.py --godot "$GODOT_BINARY" --suite content_persistence_tests --suite content_catalog_tests --suite content_scenario_ui_tests --suite notebook_tests --suite weekend_launch_tests --suite reproduction_tests
      - name: Publish the verified source to an isolated result branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): authored circuits and scenarios with lossless saved continuation' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/content-circuits-742d0672-result"
          printf 'Published commit: %s\nVerified source tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-scenario-publication-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 14
