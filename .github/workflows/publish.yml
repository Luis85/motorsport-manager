name: Publish verified roster integration
on:
  push:
    branches: [chore/data-driven-roster-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_COMMIT: c80f8922e8e804d99ad7c201ee7b9984c8f90e37
      EXPECTED_TREE: 1269f286b2f12c46d9481966e2160ca370c8ec11
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct the exact locally verified roster source
        shell: bash
        run: |
          set -euo pipefail
          cat parts/{00..15} > /tmp/roster.patch.xz
          echo '78bf64c6f7b1d3e856e2553f2b285aabd19f37bdb4c0dbbc9587770a5bbe6660  /tmp/roster.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/roster.patch.xz > /tmp/roster.patch
          echo 'b9f83391a48fa72427515ce9f4100e5d85d4d09f8ee880e0e5e1416086e0a0f7  /tmp/roster.patch' | sha256sum --check
          git checkout --detach "$BASE_COMMIT"
          git apply --unidiff-zero --check /tmp/roster.patch
          git apply --unidiff-zero --index /tmp/roster.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p test_content_authoring.py
      - name: Verify production content, physical weekend, replay and native UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          python3 scripts/content.py schemas --check --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --suite roster_content_tests --suite roster_content_ui_tests --suite car_record_tests --suite content_tests --suite presentation_boundary_tests --suite architecture_characterization_tests --suite weekend_launch_tests
      - name: Publish the verified source tree to an isolated result branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): support externally authored teams, drivers and frozen variable-size rosters' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/data-driven-roster-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-integration-verification
          path: reports/
          if-no-files-found: warn
