name: Verify frozen competition integration
on:
  push:
    branches: [chore/content-competition-500ff86e-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
      BASE_COMMIT: a2cd61e554f35e7297ae56307bf5ec92b706afad
      EXPECTED_TREE: 500ff86ed60ca29fd030de345a79baea36ed64dc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct the source-bound implementation
        shell: bash
        run: |
          set -euo pipefail
          cat payload.part0.xz payload.part1.xz payload.part2.xz > /tmp/content.patch.xz
          echo '1c22d05ac4cebe1d8b2b2e65e3362bb1bbdf21733ec97a905a85a9cb8cdb9fee  /tmp/content.patch.xz' | sha256sum --check
          xz -dc /tmp/content.patch.xz > /tmp/content.patch
          echo '6c47176fe5ed6511e45c32fee6b1964e2c17a6005b082449e33d439637a182f9  /tmp/content.patch' | sha256sum --check
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/content.patch
          git apply --index /tmp/content.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify competition and retained sporting contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/content.py schemas --check --godot "$godot"
          python3 scripts/verify.py --godot "$godot" --suite content_competition_tests --suite rival_styles_tests --suite living_racecraft_tests --suite content_tuning_tests --suite content_weekend_ui_tests --suite architecture_characterization
      - name: Publish verified source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): externalize competition policy and rival profiles with frozen continuation' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/content-competition-500ff86e-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competition-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 14
