name: Verify frozen environment content
on:
  push:
    branches: [chore/content-environment-60e53401-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
      BASE_COMMIT: 177aa7911fbf0c614ec0885ab770cd436673dea4
      EXPECTED_TREE: 60e53401076b46bbf81b8071ea28c7e4048f5e3f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source-bound environment implementation
        shell: bash
        run: |
          set -euo pipefail
          cat payload.part0.xz payload.part1.xz payload.part2.xz payload.part3.xz payload.part4.xz payload.part5.xz > /tmp/content.patch.xz
          echo '6095ec96689f645af882b2d786d5dfdda0c9cdd2854551b1e7bdb83e41e15676  /tmp/content.patch.xz' | sha256sum --check
          xz -dc /tmp/content.patch.xz > /tmp/content.patch
          echo '213695c8e4cb30b74e133827c1e24588958a8252ba272c89fe7e0bf69eea7629  /tmp/content.patch' | sha256sum --check
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/content.patch
          git apply --index /tmp/content.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 scripts/check_architecture.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify baseline trajectories and authored environment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_*
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 scripts/content.py schemas --check --godot "$godot"
          python3 scripts/verify.py --godot "$godot" --suite architecture_characterization --suite weather_tests --suite content_tuning_tests --suite content_environment_tests
      - name: Publish verified source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat(content): freeze weather and surface calibration with legacy parity' | git commit-tree "$EXPECTED_TREE" -p "$BASE_COMMIT")
          git push origin "$commit:refs/heads/chore/content-environment-60e53401-result"
          printf 'Published commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-content-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 14
